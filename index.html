<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Định Lý Thales Mở Rộng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <div class="container">
    <div class="card">
      
      <!-- Cụm nội dung chính gồm 2 cột -->
      <div class="card-body">
        
        <!-- Cột 1: Hình học SVG -->
        <div class="visual-col">
          <div class="header-box header-mobile-only">
            <h2 class="title thales-title">Thales Mở Rộng</h2>
            <span class="badge thales-badge" id="badgeThalesMob">MN // BC</span>
          </div>

          <div class="canvas-wrap" id="wrapThales">
            <svg id="svgThales" viewBox="0 0 460 340">
              <defs>
                <pattern id="gridT" width="20" height="20" patternUnits="userSpaceOnUse">
                  <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(15, 23, 42, 0.05)" stroke-width="1"/>
                </pattern>
              </defs>
              <rect width="460" height="340" fill="url(#gridT)"/>

              <line id="extThalesL" class="ext-line" />
              <line id="extThalesR" class="ext-line" />

              <polygon id="polyABC" class="geom-poly" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
              <line id="basePulseThales" class="pulse-line pulse-thales" />
              <line id="lineMN" class="geom-line-mn" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>

              <!-- 3 đỉnh A, B, C hiển thị -->
              <circle id="ptA" class="pt-abc" r="6" fill="#2563eb"/>
              <circle id="ptB" class="pt-abc" r="6" fill="#2563eb"/>
              <circle id="ptC" class="pt-abc" r="6" fill="#2563eb"/>

              <!-- Hitbox cảm ứng vô hình cho A, B, C -->
              <circle id="hitA" class="vertex-hitbox" r="22" cx="0" cy="0" fill="transparent"/>
              <circle id="hitB" class="vertex-hitbox" r="22" cx="0" cy="0" fill="transparent"/>
              <circle id="hitC" class="vertex-hitbox" r="22" cx="0" cy="0" fill="transparent"/>

              <circle id="ptM" class="pt-mn" r="6.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
              <circle id="ptN" class="pt-mn" r="6.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

              <text id="lblA" class="v-label lbl-abc" fill="#1e40af">A</text>
              <text id="lblB" class="v-label lbl-abc" fill="#1e40af">B</text>
              <text id="lblC" class="v-label lbl-abc" fill="#1e40af">C</text>
              <text id="lblM" class="v-label lbl-mn" fill="#b45309">M</text>
              <text id="lblN" class="v-label lbl-mn" fill="#b45309">N</text>

              <g id="grpAM">
                <rect id="bgAM" class="dim-bg" stroke="#93c5fd"/>
                <text id="txtAM" class="dim-text" fill="#1e40af"></text>
              </g>
              <g id="grpMB">
                <rect id="bgMB" class="dim-bg" stroke="#93c5fd"/>
                <text id="txtMB" class="dim-text" fill="#1e40af"></text>
              </g>
              <g id="grpAN">
                <rect id="bgAN" class="dim-bg" stroke="#93c5fd"/>
                <text id="txtAN" class="dim-text" fill="#1e40af"></text>
              </g>
              <g id="grpNC">
                <rect id="bgNC" class="dim-bg" stroke="#93c5fd"/>
                <text id="txtNC" class="dim-text" fill="#1e40af"></text>
              </g>
            </svg>
          </div>
        </div>

        <!-- Cột 2: Bảng công thức & Kéo dấu -->
        <div class="math-panel">
          <div class="header-box header-desktop-box">
            <div class="header-titles">
              <h2 class="title thales-title">Hệ Thức Tỉ Lệ</h2>
              <span class="badge thales-badge" id="badgeThales">MN // BC</span>
            </div>
            
            <div class="header-tools">
              <div class="sign-bank" title="Kéo hoặc nhấp dấu để đưa vào ô ?">
                <div class="sign-tile" draggable="true" data-sign="=">=</div>
                <div class="sign-tile" draggable="true" data-sign="≠">≠</div>
                <div class="sign-tile" draggable="true" data-sign="<">&lt;</div>
                <div class="sign-tile" draggable="true" data-sign=">">&gt;</div>
              </div>

              <button class="btn-rotate" id="btnRotateThales" title="Xoay cạnh song song" aria-label="Xoay cạnh song song">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                <span class="btn-rotate-text">Xoay</span>
              </button>
            </div>
          </div>

          <div class="formula-col">
            <!-- Bộ 1 -->
            <div class="formula-unit">
              <div class="calc-row-cards">
                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameAM" class="num">AM</span>
                    <span id="nameAB" class="den">AB</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numAM" class="num">0.0</span>
                    <span id="denAB" class="den">0.0</span>
                  </span>
                  <span id="eqRatio1L" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatioL" class="math-font">0.00</span>
                </div>

                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameAN" class="num">AN</span>
                    <span id="nameAC" class="den">AC</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numAN" class="num">0.0</span>
                    <span id="denAC" class="den">0.0</span>
                  </span>
                  <span id="eqRatio1R" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatioR" class="math-font">0.00</span>
                </div>
              </div>

              <div class="drop-question-row">
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameAM1" class="num">AM</span>
                    <span id="qNameAB1" class="den">AB</span>
                  </span>
                </div>
                <div class="drop-zone" data-index="1" title="Kéo thả dấu hoặc nhấp để chọn">?</div>
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameAN1" class="num">AN</span>
                    <span id="qNameAC1" class="den">AC</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Bộ 2 -->
            <div class="formula-unit">
              <div class="calc-row-cards">
                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameAM2" class="num">AM</span>
                    <span id="nameBM2" class="den">BM</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numAM2" class="num">0.0</span>
                    <span id="denBM2" class="den">0.0</span>
                  </span>
                  <span id="eqRatio2L" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatio2L" class="math-font">0.00</span>
                </div>

                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameAN2" class="num">AN</span>
                    <span id="nameCN2" class="den">CN</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numAN2" class="num">0.0</span>
                    <span id="denCN2" class="den">0.0</span>
                  </span>
                  <span id="eqRatio2R" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatio2R" class="math-font">0.00</span>
                </div>
              </div>

              <div class="drop-question-row">
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameAM2" class="num">AM</span>
                    <span id="qNameBM2" class="den">BM</span>
                  </span>
                </div>
                <div class="drop-zone" data-index="2" title="Kéo thả dấu hoặc nhấp để chọn">?</div>
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameAN2" class="num">AN</span>
                    <span id="qNameCN2" class="den">CN</span>
                  </span>
                </div>
              </div>
            </div>

            <!-- Bộ 3 -->
            <div class="formula-unit">
              <div class="calc-row-cards">
                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameBM3" class="num">BM</span>
                    <span id="nameAB3" class="den">AB</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numBM3" class="num">0.0</span>
                    <span id="denAB3" class="den">0.0</span>
                  </span>
                  <span id="eqRatio3L" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatio3L" class="math-font">0.00</span>
                </div>

                <div class="side-tag side-thales">
                  <span class="frac-block">
                    <span id="nameCN3" class="num">CN</span>
                    <span id="nameAC3" class="den">AC</span>
                  </span>
                  <span class="op-eq">&nbsp;=&nbsp;</span>
                  <span class="frac-block">
                    <span id="numCN3" class="num">0.0</span>
                    <span id="denAC3" class="den">0.0</span>
                  </span>
                  <span id="eqRatio3R" class="op-eq">&nbsp;=&nbsp;</span>
                  <span id="valRatio3R" class="math-font">0.00</span>
                </div>
              </div>

              <div class="drop-question-row">
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameBM3" class="num">BM</span>
                    <span id="qNameAB3" class="den">AB</span>
                  </span>
                </div>
                <div class="drop-zone" data-index="3" title="Kéo thả dấu hoặc nhấp để chọn">?</div>
                <div class="ratio-pure">
                  <span class="frac-block">
                    <span id="qNameCN3" class="num">CN</span>
                    <span id="qNameAC3" class="den">AC</span>
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Thanh trượt full dòng xuyên suốt 2 tab + Nút chuyển mode ABC/MN -->
      <div class="controls-bar">
        <div class="slider-row">
          <input id="sliderMN" class="thales-slider" type="range" min="-0.4" max="1.4" step="0.005" value="0.5">
        </div>

        <div class="mode-switch">
          <button type="button" class="btn-mode active" id="btnModeMN">Kéo MN</button>
          <button type="button" class="btn-mode" id="btnModeABC">Chỉnh ABC</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
