<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mô Phỏng Định Lý Thales Mở Rộng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .canvas-wrap {
      touch-action: none;
      user-select: none;
      cursor: ns-resize;
    }
  </style>
</head>
<body>

  <div class="container" style="justify-content: center;">

    <div class="card" style="max-width: 520px; width: 100%;">
      <div class="header-box">
        <h2 class="title thales-title">Định Lý Thales Mở Rộng</h2>
        <span class="badge thales-badge">MN // BC</span>
      </div>

      <div class="canvas-wrap" id="wrapThales">
        <svg id="svgThales" viewBox="0 0 460 380">
          <defs>
            <pattern id="gridT" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
            </pattern>
          </defs>
          <rect width="460" height="380" fill="url(#gridT)"/>

          <line id="extAB" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.8" stroke-dasharray="4,4"/>
          <line id="extAC" stroke="rgba(96, 165, 250, 0.35)" stroke-width="1.8" stroke-dasharray="4,4"/>

          <polygon id="polyABC" fill="rgba(37, 99, 235, 0.08)" stroke="#3b82f6" stroke-width="2.5"/>
          <line id="lineMN" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

          <circle id="ptA" r="5" fill="#60a5fa"/>
          <circle id="ptB" r="5" fill="#60a5fa"/>
          <circle id="ptC" r="5" fill="#60a5fa"/>
          <circle id="ptM" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>
          <circle id="ptN" r="6" fill="#fbbf24" stroke="#ffffff" stroke-width="1.5"/>

          <text id="lblA" class="v-label" fill="#93c5fd">A</text>
          <text id="lblB" class="v-label" fill="#93c5fd">B</text>
          <text id="lblC" class="v-label" fill="#93c5fd">C</text>
          <text id="lblM" class="v-label" fill="#fcd34d">M</text>
          <text id="lblN" class="v-label" fill="#fcd34d">N</text>

          <g id="grpAM">
            <rect id="bgAM" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtAM" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpMB">
            <rect id="bgMB" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtMB" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpAN">
            <rect id="bgAN" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtAN" class="dim-text" fill="#93c5fd"></text>
          </g>
          <g id="grpNC">
            <rect id="bgNC" class="dim-bg" stroke="#60a5fa"/>
            <text id="txtNC" class="dim-text" fill="#93c5fd"></text>
          </g>
        </svg>
      </div>

      <div class="controls">
        <div class="slider-row">
          <input id="sliderMN" class="thales-slider" type="range" min="-0.35" max="1.45" step="0.005" value="0.55">
        </div>
      </div>

      <div class="math-panel">
        <div class="formula-row">
          <div class="side-tag side-thales">
            <span class="frac-block">
              <span class="num">AM</span>
              <span class="den">AB</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numAM" class="num">0.0</span>
              <span id="denAB" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioL" class="math-font">0.00</span>
          </div>

          <span class="math-eq">=</span>

          <div class="side-tag side-thales">
            <span class="frac-block">
              <span class="num">AN</span>
              <span class="den">AC</span>
            </span>
            &nbsp;=&nbsp;
            <span class="frac-block">
              <span id="numAN" class="num">0.0</span>
              <span id="denAC" class="den">0.0</span>
            </span>
            &nbsp;=&nbsp;
            <span id="valRatioR" class="math-font">0.00</span>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const A = { x: 215, y: 95 };
    const B = { x: 105, y: 285 };
    const C = { x: 380, y: 265 };

    const minK = -0.35;
    const maxK = 1.45;

    function dist(p1, p2) {
      return Math.sqrt((p2.x - p1.x) ** 2 + (p2.y - p1.y) ** 2);
    }

    function lerp(p1, p2, t) {
      return {
        x: p1.x + (p2.x - p1.x) * t,
        y: p1.y + (p2.y - p1.y) * t
      };
    }

    function setTag(txtId, bgId, textVal, p1, p2, ox, oy) {
      const txt = document.getElementById(txtId);
      const bg = document.getElementById(bgId);
      txt.textContent = textVal;
      const mx = (p1.x + p2.x) / 2 + ox;
      const my = (p1.y + p2.y) / 2 + oy;
      txt.setAttribute('x', mx);
      txt.setAttribute('y', my);
      const b = txt.getBBox();
      bg.setAttribute('x', b.x - 4);
      bg.setAttribute('y', b.y - 2);
      bg.setAttribute('width', b.width + 8);
      bg.setAttribute('height', b.height + 4);
    }

    function updateThales() {
      const k = parseFloat(document.getElementById('sliderMN').value);
      const M = lerp(A, B, k);
      const N = lerp(A, C, k);

      document.getElementById('polyABC').setAttribute('points', `${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`);

      const extAB_start = lerp(A, B, minK);
      const extAB_end = lerp(A, B, maxK);
      const extAB = document.getElementById('extAB');
      extAB.setAttribute('x1', extAB_start.x);
      extAB.setAttribute('y1', extAB_start.y);
      extAB.setAttribute('x2', extAB_end.x);
      extAB.setAttribute('y2', extAB_end.y);

      const extAC_start = lerp(A, C, minK);
      const extAC_end = lerp(A, C, maxK);
      const extAC = document.getElementById('extAC');
      extAC.setAttribute('x1', extAC_start.x);
      extAC.setAttribute('y1', extAC_start.y);
      extAC.setAttribute('x2', extAC_end.x);
      extAC.setAttribute('y2', extAC_end.y);

      const lineMN = document.getElementById('lineMN');
      lineMN.setAttribute('x1', M.x);
      lineMN.setAttribute('y1', M.y);
      lineMN.setAttribute('x2', N.x);
      lineMN.setAttribute('y2', N.y);

      function setPt(id, p) {
        const el = document.getElementById(id);
        el.setAttribute('cx', p.x);
        el.setAttribute('cy', p.y);
      }
      setPt('ptA', A);
      setPt('ptB', B);
      setPt('ptC', C);
      setPt('ptM', M);
      setPt('ptN', N);

      function setPos(id, p, dx, dy) {
        const el = document.getElementById(id);
        el.setAttribute('x', p.x + dx);
        el.setAttribute('y', p.y + dy);
      }
      setPos('lblA', A, -4, -14);
      setPos('lblB', B, -16, 14);
      setPos('lblC', C, 14, 12);
      setPos('lblM', M, -18, -4);
      setPos('lblN', N, 16, -4);

      const dAB_raw = dist(A, B) / 25;
      const dAC_raw = dist(A, C) / 25;

      const geomRatio = Math.abs(k);
      const dAM_raw = dAB_raw * geomRatio;
      const dMB_raw = dAB_raw * Math.abs(1 - k);
      const dAN_raw = dAC_raw * geomRatio;
      const dNC_raw = dAC_raw * Math.abs(1 - k);

      const dAM = dAM_raw.toFixed(1);
      const dMB = dMB_raw.toFixed(1);
      const dAN = dAN_raw.toFixed(1);
      const dNC = dNC_raw.toFixed(1);
      const dAB = dAB_raw.toFixed(1);
      const dAC = dAC_raw.toFixed(1);

      setTag('txtAM', 'bgAM', dAM, A, M, -18, 0);
      setTag('txtMB', 'bgMB', dMB, M, B, -18, 0);
      setTag('txtAN', 'bgAN', dAN, A, N, 18, 0);
      setTag('txtNC', 'bgNC', dNC, N, C, 18, 0);

      const ratioStr = geomRatio.toFixed(2);

      document.getElementById('numAM').textContent = dAM;
      document.getElementById('denAB').textContent = dAB;
      document.getElementById('valRatioL').textContent = ratioStr;

      document.getElementById('numAN').textContent = dAN;
      document.getElementById('denAC').textContent = dAC;
      document.getElementById('valRatioR').textContent = ratioStr;
    }

    function setupPanelDrag(wrapId, svgId, sliderId, topY, bottomY, callback) {
      const wrap = document.getElementById(wrapId);
      const svg = document.getElementById(svgId);
      const slider = document.getElementById(sliderId);
      let isDragging = false;

      function getSvgY(e) {
        const pt = svg.createSVGPoint();
        const clientY = e.touches ? e.touches[0].clientY : e.clientX !== undefined ? e.clientY : 0;
        pt.x = 0;
        pt.y = clientY;
        return pt.matrixTransform(svg.getScreenCTM().inverse()).y;
      }

      function applyDrag(e) {
        const curY = getSvgY(e);
        let ratio = (curY - topY) / (bottomY - topY);
        const minVal = parseFloat(slider.min);
        const maxVal = parseFloat(slider.max);
        ratio = Math.max(minVal, Math.min(maxVal, ratio));
        slider.value = ratio;
        callback();
      }

      function handleStart(e) {
        isDragging = true;
        applyDrag(e);
        if (e.cancelable) e.preventDefault();
      }

      function handleMove(e) {
        if (!isDragging) return;
        applyDrag(e);
        if (e.cancelable) e.preventDefault();
      }

      function handleEnd() {
        isDragging = false;
      }

      wrap.addEventListener('mousedown', handleStart);
      wrap.addEventListener('touchstart', handleStart, { passive: false });

      window.addEventListener('mousemove', handleMove);
      window.addEventListener('touchmove', handleMove, { passive: false });

      window.addEventListener('mouseup', handleEnd);
      window.addEventListener('touchend', handleEnd);
    }

    document.getElementById('sliderMN').addEventListener('input', updateThales);

    setupPanelDrag('wrapThales', 'svgThales', 'sliderMN', A.y, (B.y + C.y) / 2, updateThales);

    window.addEventListener('DOMContentLoaded', () => {
      updateThales();
    });
  </script>
</body>
</html>
